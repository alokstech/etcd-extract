<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>etcd-extract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="topbar">
        <div class="brand">etcd-extract</div>
        <div class="db-selector">
            <input type="text" id="db-path" placeholder="Enter path to etcd database file...">
            <button id="load-btn">Load</button>
        </div>
        <div class="db-status" id="db-status"></div>
    </nav>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-placeholder" id="sidebar-placeholder">
                Load a database to browse resources
            </div>
            <div id="sidebar-content" class="hidden">
                <div class="sidebar-section">
                    <h3 class="section-title">Cluster Scoped</h3>
                    <ul id="cluster-resources" class="resource-list"></ul>
                </div>
                <div class="sidebar-section">
                    <h3 class="section-title">Namespaced</h3>
                    <div class="namespace-filter">
                        <select id="namespace-select">
                            <option value="">All Namespaces</option>
                        </select>
                    </div>
                    <ul id="namespaced-resources" class="resource-list"></ul>
                </div>
            </div>
        </aside>

        <main class="content">
            <div id="welcome" class="welcome-msg">
                <h2>Welcome to etcd-extract</h2>
                <p>Load an etcd database file to browse and extract Kubernetes resources</p>
            </div>

            <div id="object-list" class="hidden">
                <div class="content-header">
                    <h2 id="list-title"></h2>
                    <span id="list-count" class="count-badge"></span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Namespace</th>
                                <th>Name</th>
                            </tr>
                        </thead>
                        <tbody id="objects-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div id="object-detail" class="hidden">
                <div class="detail-header">
                    <button id="back-btn">&larr; Back</button>
                    <span id="detail-title" class="detail-title"></span>
                    <div class="detail-actions">
                        <select id="format-select">
                            <option value="yaml">YAML</option>
                            <option value="json">JSON</option>
                        </select>
                        <button id="copy-btn">Copy</button>
                        <button id="download-btn">Download</button>
                    </div>
                </div>
                <pre id="object-content" class="object-content"></pre>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
